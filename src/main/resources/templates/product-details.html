<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Basic page setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Black Diamond Gear</title>

    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Header section -->
<header>
    <nav class="navbar">
        <!-- Website name and logo -->
        <section class="site-branding">
            <img src="/images/black-diamond-logo.png" alt="Black Diamond Gear logo" class="site-logo">
            <h1 class="site-title">Black Diamond Gear</h1>
        </section>

        <!-- Main navigation links -->
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/messages">Expert Help</a></li>
            <!-- Show Dashboard + Logout if a session exists, otherwise show Login + Register -->
            <li th:if="${session.user_id != null}">
                <a th:href="${session.role == 'admin'} ? '/admin-dashboard' : (${session.role == 'expert'} ? '/expert-dashboard' : '/customer-dashboard')">Dashboard</a>
            </li>
            <li th:if="${session.user_id != null}"><a href="/logout">Logout</a></li>
            <li th:unless="${session.user_id != null}"><a href="/login">Login</a></li>
            <li th:unless="${session.user_id != null}"><a href="/register">Register</a></li>
        </ul>
    </nav>
</header>

<!-- Main content -->
<main>

    <!-- Displays information about one selected product -->
    <section class="product-detail">
        <article class="detail-card">

            <!-- Shows the selected product name from the database -->
            <h2 th:text="${product.productName}">Product Name</h2>

            <!-- Shows the product image saved in the database -->
            <img th:if="${product.imageUrl != null}"
                 th:src="${product.imageUrl}"
                 th:alt="${product.productName}"
                 class="product-detail-image">

            <!-- Product information from the database -->
            <p class="product-price" th:text="${'$' + product.price}">$0.00</p>
            <p class="product-category" th:text="${'Category: ' + product.categoryName}">Category: Category</p>
            <p th:text="${'Description: ' + product.description}">Description: Product description</p>
            <p th:text="${'Stock Quantity: ' + product.stockQuantity}">Stock Quantity: 0</p>

            <!-- Product action links -->
            <section class="product-actions">
                <form action="/cart/add" method="post">
                    <input type="hidden" name="productId" th:value="${product.productId}">
                    <button type="submit" class="button">Add to Cart</button>
                </form>

                <a href="/messages" class="button secondary">Ask an Expert</a>
                <a href="/products" class="button secondary">Back to Products</a>
            </section>
        </article>
    </section>

</main>

<!-- Footer section -->
<footer>
    <p>&copy; 2026 Black Diamond Gear. All rights reserved.</p>
</footer>

</body>
</html>
